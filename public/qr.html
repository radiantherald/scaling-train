<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mid-Year Review — Scan to Evaluate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-elevated: #1f242c;
      --border: #30363d;
      --border-subtle: #21262d;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --text-dim: #6e7681;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--accent-soft);
      border: 1px solid rgba(37, 99, 235, 0.3);
      color: #93c5fd;
      padding: 3px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 8px;
    }

    p.desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .qr-frame {
      background: #ffffff;
      padding: 16px;
      border-radius: 8px;
      display: inline-block;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      margin-bottom: 24px;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      margin: 0 auto;
    }

    .url-row {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .url-text {
      font-size: 0.82rem;
      color: #93c5fd;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      word-break: break-all;
      text-align: left;
    }

    .btn-copy {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.76rem;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn-copy:hover {
      background: #28303d;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 0.84rem;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }

    .footer-links a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Performance Review</div>
    <h1>Scan to Review Teammates</h1>
    <p class="desc">Scan with your mobile camera to open the portal and submit your point allocations and mid-year review feedback for the team.</p>

    <div class="qr-frame">
      <div id="qrcode"></div>
    </div>

    <div class="url-row">
      <span class="url-text" id="targetUrl">Loading...</span>
      <button class="btn-copy" onclick="copyUrl()">Copy</button>
    </div>

    <div class="footer-links">
      <a href="/" target="_blank">Open Review Portal ↗</a>
      <span>•</span>
      <a href="/admin" target="_blank">Review Dashboard ↗</a>
    </div>
  </div>

  <script>
    let currentUrl = window.location.origin + '/';

    async function initQR() {
      try {
        const res = await fetch('/api/info');
        const info = await res.json();
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          currentUrl = window.location.origin + '/';
        } else {
          currentUrl = info.votingUrl;
        }
      } catch (e) {
        currentUrl = window.location.origin + '/';
      }

      document.getElementById('targetUrl').textContent = currentUrl;

      const qrEl = document.getElementById('qrcode');
      qrEl.innerHTML = '';
      new QRCode(qrEl, {
        text: currentUrl,
        width: 200,
        height: 200,
        colorDark: "#0d1117",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function copyUrl() {
      navigator.clipboard.writeText(currentUrl).then(() => {
        alert('Review URL copied to clipboard: ' + currentUrl);
      });
    }

    initQR();
  </script>
</body>
</html>
